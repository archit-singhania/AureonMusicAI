services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aureon
      POSTGRES_USER: aureon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aureon]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
  python_audio:
    build: ./python_audio_service
    environment:
      DATABASE_URL: postgresql+psycopg://aureon:${POSTGRES_PASSWORD}@postgres/aureon
      REDIS_URL: redis://redis:6379/0
      AUREON_DATA_DIR: /app/data
      AUREON_INTERNAL_KEY: ${AUREON_INTERNAL_KEY:?Set AUREON_INTERNAL_KEY in .env}
      AUREON_ORIGINS: ${AUREON_ORIGINS:-http://localhost:3005}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes: [studio_data:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  dotnet_api:
    build: ./dotnet_backend
    environment:
      AudioService__BaseUrl: http://python_audio:8000
      AUREON_INTERNAL_KEY: ${AUREON_INTERNAL_KEY:?Set AUREON_INTERNAL_KEY in .env}
      AllowedOrigins: ${AUREON_ORIGINS:-http://localhost:3005}
    depends_on: [python_audio]
  flutter_ui:
    build: ./flutter_app
    ports: [3005:80]
    depends_on: [dotnet_api]
volumes:
  postgres_data:
  redis_data:
  studio_data:

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aureon — a considered workspace for composing, mixing and sharing your sound.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aureon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aureon · Your sound, considered</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F5F0">
  <style>
    @font-face { font-family: Manrope; src: url('assets/assets/fonts/Manrope-Variable.ttf') format('truetype'); font-weight: 200 800; font-style: normal; font-display: swap; }
    body { margin: 0; background: radial-gradient(ellipse at 18% 8%, #EFE8F6, transparent 65%), radial-gradient(ellipse at 90% 95%, #F6E9E0, transparent 60%), #F8F5F0; color: #252331; font-family: Manrope, system-ui, sans-serif; }
    #studio-loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(300px, calc(100% - 100px)); padding: 38px 26px; display: grid; text-align: center; gap: 22px; border: 1px solid #ffffffd9; border-radius: 28px; background: #fefcf8d9; backdrop-filter: blur(16px); box-shadow: 0 16px 60px #221a3c12; }
    #studio-loading svg { margin: auto; width: 64px; height: 64px; }
    #studio-loading-status { font-size: 14px; font-weight: 500; letter-spacing: -.2px; }
    #studio-retry { background: #6850AD; color: white; border: 0; border-radius: 14px; padding: 15px 24px; font: inherit; font-weight: 650; cursor: pointer; }
    #studio-retry:focus-visible { outline: 3px solid #6850AD; outline-offset: 4px; }
    #studio-retry[hidden] { display: none; }
    @media (prefers-color-scheme: dark) { body { background: radial-gradient(ellipse at 18% 8%, #24223A, transparent 65%), #12151E; color: #F4F0F9; } #studio-loading { background: #1c202ce6; border-color: #ffffff38; box-shadow: 0 20px 70px #00000033; } }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) { #studio-loading { backdrop-filter: none; background: #FEFCF8; border-color: #4C4657; } }
    @media (prefers-color-scheme: dark) and (prefers-reduced-transparency: reduce), (prefers-color-scheme: dark) and (prefers-contrast: more) { #studio-loading { background: #1C202C; border-color: #CFCDD7; } }
  </style>
</head>
<body>
  <div id="studio-loading" role="status" aria-live="polite">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="studio-iris" x2="1" y2="1"><stop stop-color="#9C83DA"/><stop offset=".55" stop-color="#60449C"/><stop offset="1" stop-color="#47316E"/></linearGradient></defs><rect width="64" height="64" rx="20" fill="url(#studio-iris)"/><path d="M14 48 32 15 50 48M25 44V36M31 44V30M37 44V26M43 44V34" fill="none" stroke="#FEFCF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="studio-loading-status">Preparing your studio…</div>
    <button id="studio-retry" hidden>Reload studio</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

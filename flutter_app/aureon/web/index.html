<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aureon — a considered workspace for composing, mixing and sharing your sound.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aureon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aureon · Your sound, considered</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F1ED">
  <style>
    body { margin: 0; background: #F2F1ED; color: #22242C; font-family: system-ui, sans-serif; }
    #studio-loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px; }
    #studio-loading svg { margin: auto; width: 64px; height: 64px; }
    #studio-loading-status { font-size: 14px; }
    #studio-retry { background: #7862B7; color: white; border: 0; border-radius: 14px; padding: 15px 24px; font: inherit; cursor: pointer; }
    #studio-retry[hidden] { display: none; }
    @media (prefers-color-scheme: dark) { body { background: #15171E; color: #FAF9F6; } }
  </style>
</head>
<body>
  <div id="studio-loading" role="status" aria-live="polite">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="20" fill="#7862B7"/><path d="M14 48 32 15 50 48M25 44V36M31 44V30M37 44V26M43 44V34" fill="none" stroke="#FAF9F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="studio-loading-status">Preparing your studio…</div>
    <button id="studio-retry" hidden>Reload studio</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

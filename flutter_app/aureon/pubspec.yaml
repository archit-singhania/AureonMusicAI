name: aureon
description: A considered music workspace for composition, mixing and sharing.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.8.0
  file_picker: ^10.3.10
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  record: ^6.2.0
  path_provider: ^2.1.5
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  google_fonts: ^6.3.0
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/aureon-mark.svg

name: Aureon quality
on: [push, pull_request, workflow_dispatch]
jobs:
  audio-and-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: python_audio_service/requirements-dev.txt}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r python_audio_service/requirements-dev.txt
      - run: pytest tests/test_studio.py tests/test_providers.py -q
      - run: dotnet build dotnet_backend/AureonApi/AureonApi.csproj -c Release
      - name: Gateway and live-event journey
        env:
          AUREON_INTERNAL_KEY: ci-local-only-key
          AUREON_GATEWAY_URL: http://localhost:5000
        run: |
          (cd python_audio_service && uvicorn main:app --host 127.0.0.1 --port 8103) > /tmp/aureon-python.log 2>&1 &
          dotnet run --no-build -c Release --project dotnet_backend/AureonApi --urls http://localhost:5000 > /tmp/aureon-dotnet.log 2>&1 &
          for attempt in $(seq 1 40); do curl -sf http://localhost:5000/health && curl -sf http://localhost:8103/health && break; sleep 1; done
          pytest tests/test_gateway.py -q
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.3', cache: true}
      - working-directory: flutter_app/aureon
        run: flutter pub get
      - working-directory: flutter_app/aureon
        run: flutter analyze
      - working-directory: flutter_app/aureon
        run: flutter test
      - working-directory: flutter_app/aureon
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with: {name: aureon-web, path: flutter_app/aureon/build/web}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.3', cache: true}
      - working-directory: flutter_app/aureon
        run: flutter pub get
      - working-directory: flutter_app/aureon
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:5000
      - uses: actions/upload-artifact@v4
        with: {name: aureon-android-debug, path: flutter_app/aureon/build/app/outputs/flutter-apk/app-debug.apk}
  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.3', cache: true}
      - working-directory: flutter_app/aureon
        run: flutter pub get
      - working-directory: flutter_app/aureon
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with: {name: aureon-ios-unsigned, path: flutter_app/aureon/build/ios/iphoneos/Runner.app}
